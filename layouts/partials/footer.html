<footer class="text-sm text-center border-t border-gray-500 {{ if .IsHome }} bg-gray-200 dark:bg-dark rounded-b-lg py-2 {{ else }} py-6 {{ end }}">
  <p class="{{ if not .Site.Params.theme.showAttribute }}hidden{{ end }}">
    <span class="footer-link-list">
      <span>Based on</span>
      <a href="https://themes.gohugo.io/themes/aafu/">aafu</a>
      <span>by</span>
      <a href="https://www.darshanbaral.com/">darshan</a>
    </span>
  </p>
  <p class="markdownify">{{ .Site.Params.copyright | markdownify }} @ {{ now.Format "2006" }}</p>

  {{ if .Site.Params.theme.singlePage }}
  <button
    type="button"
    class="text-blue-500 hover:text-blue-700 dark:text-yellow-300 dark:hover:text-yellow-500 cursor-pointer text-lg mr-9 sm:mr-0"
    data-theme-toggle
    aria-label="Toggle theme"
    title="Toggle theme"
  >
    <i class="fas fa-sun theme-toggle" aria-hidden="true"></i>
  </button>
  {{ end }}
</footer>
