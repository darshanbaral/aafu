<footer class="text-sm text-center border-t border-gray-500 {{ if .IsHome }} bg-gray-200 dark:bg-gray-600 rounded-b-lg py-2 {{ else }} py-6 {{ end }}">
  <p class="markdownify my-0">
    {{- .Site.Params.copyright | markdownify }}
    {{- if .Site.Params.theme.showAttribute }} · <a href="https://themes.gohugo.io/themes/aafu/">aafu</a> by <a href="https://www.darshanbaral.com/">darshan</a>{{ end }} @ {{ now.Format "2006" -}}
  </p>
  <p class="my-0">icons by <a href="https://fontawesome.com/">Font Awesome</a></p>

  {{ if .Site.Params.theme.singlePage }}
  <button
    type="button"
    class="text-link hover:text-link-hover dark:text-link-dark dark:hover:text-link-dark-hover cursor-pointer text-lg mr-9 sm:mr-0"
    data-theme-toggle
    aria-label="Toggle theme"
    title="Toggle theme"
  >
    {{ partial "icon-theme-toggle.html" }}
  </button>
  {{ end }}
</footer>
