<h1 class="mb-0">{{ hugo.Data.profile.name }}</h1>
<h2 class="profile-tagline">{{ hugo.Data.profile.tagline }}</h2>
<div class="mb-4">{{ hugo.Data.profile.location }}</div>
<div class="mb-4 flex flex-wrap justify-center">
  {{ range $key, $value := hugo.Data.social }}
  <div class="mx-2">
    <a class="social-link" href="{{ .url }}" aria-label="{{ $value.title }}" title="{{ $value.title }}">
      {{ partial "icon.html" (dict "name" $value.icon "class" "mt-1") }}
    </a>
  </div>
  {{ end }}
</div>
