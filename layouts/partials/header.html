<header
  class="nav flex flex-row items-center row py-2 px-2 mb-6 w-full rounded-sm border-b border-gray-700 bg-gray-200 dark:bg-nav-dark dark:border-gray-300 justify-between"
>
  <div class="nav-links">
    <a class="nav-menu-item {{ if .IsHome }} active {{ end }}" href="{{ `/` | relURL }}" aria-label="Home" title="Home">
      <i class="fas fa-house" aria-hidden="true"></i>
    </a>
    <a class="nav-menu-item {{ if eq .Section "search" }} active {{ end }}" href="{{ `search` | relURL }}" aria-label="Search" title="Search">
      <i class="fas fa-search" aria-hidden="true"></i>
    </a>
    <a class="nav-menu-item {{ if eq .Section "blog" }} active {{ end }}" href="{{ "blog" | relURL }}" aria-label="Blog" title="Blog">
      <i class="fas fa-blog" aria-hidden="true"></i>
    </a>
    <a class="nav-menu-item {{ if eq .Section "archive" }} active {{ end }}" href="{{ "archive" | relURL }}" aria-label="Archive" title="Archive">
      <i class="fas fa-box-archive" aria-hidden="true"></i>
    </a>
  </div>

  <div class="flex items-center gap-1">
    <button
      type="button"
      class="nav-menu-item inline-flex items-center justify-center text-link hover:text-link-hover dark:text-link-dark dark:hover:text-link-dark-hover"
      data-theme-toggle
      aria-label="Toggle theme"
      title="Toggle theme"
    >
      <i class="fas fa-sun theme-toggle" aria-hidden="true"></i>
    </button>
  </div>
</header>
