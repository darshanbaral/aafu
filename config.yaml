baseURL: "https://althaser.me/"
locale: en-us
build:
  writeStats: true
module:
  mounts:
    - source: assets
      target: assets
    - source: node_modules/@fortawesome/fontawesome-free/svgs
      target: assets/icons
security:
  exec:
    allow:
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
# https://www.markdownguide.org/tools/hugo/
# https://gohugo.io/getting-started/configuration-markup/#goldmark
markup:
  goldmark:
    renderer:
      unsafe: false
title: "althaser's website"
# Uncomment below to use aafu as hugo theme. See instructions in README.md
# theme: aafu
params:
  author: Pedro Beja
  description: althaser's website
  copyright: althaser.me
  analytics:
    googleTagId: G-GL1PZQ4MJH
    goatcounterCode: althaser
  theme:
    mainTheme: dark
    singlePage: false
  accordion:
    - item: about_me
    - item: links
      expand: true    # default - only the first `expand: true` will take effect
    # - item: skills
    #  panel_id: skill-panel
